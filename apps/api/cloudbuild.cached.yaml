# Cache the previous successful API image layers across independent Cloud Build workers.
# This allows npm install, Prisma generate and OS packages to be reused when unchanged.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull "${_CACHE_IMAGE}" || true
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_CACHE_IMAGE}
      - --tag
      - ${_IMAGE}
      - --tag
      - ${_CACHE_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_CACHE_IMAGE}"]
timeout: 1200s
